name: iphone-prices

on:
  schedule:
    # Cada 5 min: el mínimo que permite GitHub Actions. En la práctica GitHub puede atrasar
    # o saltarse corridas cuando está cargado, así que el intervalo real suele ser 5–15 min.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}       # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write             # necesario para commitear prices.json

# Una corrida a la vez: si una se alarga más de 5 min, la siguiente espera en vez de
# correr en paralelo (dos corridas pisándose prices.json mandarían avisos duplicados).
concurrency:
  group: iphone-prices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ejecutar scraper
        env:
          # se configuran en GitHub: Settings → Secrets and variables → Actions
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Google Chrome ya viene instalado en los runners de GitHub: se usa ese en vez de
          # descargar Chromium en cada corrida (ahorra 1–2 min)
          BROWSER_CHANNEL: chrome
          SAVE_DEBUG: "1"     # screenshot/HTML de las URLs sin resultados → artefacto "debug"
        run: python scraper.py

      # Para diagnosticar bloqueos: en la página de la corrida, sección "Artifacts" → debug
      - name: Subir capturas de URLs sin resultados
        if: always() && hashFiles('debug/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          retention-days: 1

      # Guarda el estado (prices.json) en el repo. Además de persistir los precios,
      # el commit cuenta como actividad y evita que GitHub desactive el cron.
      - name: Guardar estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if ! git diff --staged --quiet; then
            git commit -m "update prices"
            git pull --rebase   # por si subiste cambios mientras corría
            git push
          fi
