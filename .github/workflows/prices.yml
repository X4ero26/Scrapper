name: iphone-prices

on:
  schedule:
    - cron: "17 */3 * * *"   # cada 3 h, en el minuto 17 (evita la congestión de la hora en punto)
  workflow_dispatch: {}       # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write             # necesario para commitear prices.json

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium

      - name: Ejecutar scraper
        env:
          # se configuran en GitHub: Settings → Secrets and variables → Actions
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py

      # Guarda el estado (prices.json) en el repo. Además de persistir los precios,
      # el commit cuenta como actividad y evita que GitHub desactive el cron.
      - name: Guardar estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || (git commit -m "update prices" && git push)
